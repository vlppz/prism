<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Prism</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-state="off">
    <!-- shared paint for the metallic glyphs -->
    <svg class="defs" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ff7ab8" />
          <stop offset="0.55" stop-color="#a98bff" />
          <stop offset="1" stop-color="#6f95ff" />
        </linearGradient>
        <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff" />
          <stop offset="1" stop-color="#8d8d9c" />
        </linearGradient>
        <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3a3a46" />
          <stop offset="1" stop-color="#0e0e13" />
        </linearGradient>
      </defs>
    </svg>

    <div class="titlebar" data-tauri-drag-region>
      <span class="wordmark"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.8L12.6 11.6H1.4Z" /></svg>Prism</span>
      <div class="winbtns">
        <button class="winbtn" id="gear" type="button" aria-label="Settings" aria-haspopup="dialog" aria-expanded="false">
          <svg viewBox="0 0 14 14"><path d="M2 4.5h4.2M9.8 4.5H12M2 9.5h2.2M7.8 9.5H12" /><circle cx="8" cy="4.5" r="1.7" /><circle cx="6" cy="9.5" r="1.7" /></svg>
        </button>
        <button class="winbtn win-only" id="min" type="button" aria-label="Minimize"><svg viewBox="0 0 10 10"><path d="M1.5 5h7" /></svg></button>
        <button class="winbtn win-only" id="close" type="button" aria-label="Close"><svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6" /></svg></button>
      </div>
    </div>

    <main>
      <div class="stage">
        <canvas id="orb" aria-hidden="true"></canvas>
        <button class="power" id="power" type="button" aria-label="Connect">
          <svg class="glyph glyph-power" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 4.5v8.5M8.4 8.2a8.6 8.6 0 1 0 11.2 0" /></svg>
          <svg class="glyph glyph-plus" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 6v16M6 14h16" /></svg>
        </button>
      </div>

      <section class="readout">
        <h1 id="title" aria-live="polite">Not connected</h1>
        <p id="sub"></p>
      </section>
    </main>

    <footer class="dock">
      <div class="menu" id="menu" role="listbox" aria-label="Servers"></div>
      <div class="sheet" id="sheet" role="dialog" aria-label="Connection details"></div>
      <div class="toast" id="toast" role="alert"></div>
      <div class="tray">
        <div class="stats" id="stats">
          <div class="stats-in">
            <div class="stat">
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2v8M2.5 6.5L6 10l3.5-3.5" /></svg>
              <span class="stat-label">Download</span>
              <span class="stat-val"><b id="down">0</b><i id="downUnit">B/s</i></span>
            </div>
            <div class="stat">
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10V2M2.5 5.5L6 2l3.5 3.5" /></svg>
              <span class="stat-label">Upload</span>
              <span class="stat-val"><b id="up">0</b><i id="upUnit">B/s</i></span>
            </div>
          </div>
        </div>
        <div class="pick-row">
        <button class="picker" id="picker" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="badge" id="badge" aria-hidden="true"><span class="badge-ring"></span><span class="badge-mono" id="mono"></span><span class="badge-flag" id="flag"></span></span>
          <span class="pick-text">
            <span class="pick-name" id="pickName"></span>
            <span class="pick-host" id="pickHost"></span>
          </span>
          <svg class="chev" viewBox="0 0 12 16" aria-hidden="true"><path d="M3 6l3-3 3 3M3 10l3 3 3-3" /></svg>
        </button>
        <button class="info" id="info" type="button" aria-label="Connection details" aria-haspopup="dialog" aria-expanded="false">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.4" /><path d="M8 7.2v4" /><circle class="dot" cx="8" cy="4.9" r="0.9" /></svg>
        </button>
        </div>
      </div>
    </footer>

    <div class="settings" id="settings" role="dialog" aria-label="Settings">
      <div class="set-label">Appearance</div>
      <div class="seg" id="themeSeg" role="radiogroup" aria-label="Appearance">
        <span class="seg-thumb" aria-hidden="true"></span>
        <button type="button" role="radio" data-theme="system">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.6" /><path class="fill" d="M8 2.4a5.6 5.6 0 0 1 0 11.2Z" /></svg>
          <span>System</span>
        </button>
        <button type="button" role="radio" data-theme="light">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.9" /><path d="M8 1.6v1.5M8 12.9v1.5M1.6 8h1.5M12.9 8h1.5M3.5 3.5l1 1M11.5 11.5l1 1M3.5 12.5l1-1M11.5 4.5l1-1" /></svg>
          <span>Light</span>
        </button>
        <button type="button" role="radio" data-theme="dark">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8Z" /></svg>
          <span>Dark</span>
        </button>
      </div>
      <div class="set-label set-label-next">Routing</div>
      <button class="toggle-row" id="smart" type="button" role="switch" aria-checked="true">
        <span class="tr-text">
          <span class="tr-title">Smart routing</span>
          <span class="tr-sub">Russian sites go direct, the rest through the VPN</span>
        </span>
        <span class="switch" aria-hidden="true"><span class="knob"></span></span>
      </button>
      <div class="set-foot">
        <span class="set-ver"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.8L12.6 11.6H1.4Z" /></svg>Prism <span id="ver"></span></span>
        <span class="set-actions">
          <button class="set-gh" id="gh" type="button" title="github.com/vlppz"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z" /></svg>vlppz</button>
          <button class="set-quit" id="quit" type="button">Quit Prism</button>
        </span>
      </div>
    </div>

    <div class="drop" id="drop" aria-hidden="true">
      <div class="drop-inner">
        <svg viewBox="0 0 28 28"><path d="M14 5v13M8.5 12.5L14 18l5.5-5.5M6 23h16" /></svg>
        <span>Drop to import</span>
        <small>WireGuard .conf</small>
      </div>
    </div>
    <input type="file" id="file" accept=".conf,text/plain" multiple hidden />

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
