name: Release

# Push a `v*` tag (matching the version in src-tauri/tauri.conf.json) to build
# macOS + Windows and publish a GitHub release. Running it manually
# (Actions → Release → Run workflow) only builds and uploads the installers
# as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != app version v$version" >&2; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Engine tests
        run: cargo test -p prism-engine --target ${{ matrix.target }}
        if: matrix.target != 'x86_64-apple-darwin'

      # The tunnel driver the Windows build bundles (checksum-pinned).
      - name: Fetch wintun.dll (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\wintun.zip"
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51") { throw "wintun.zip checksum mismatch: $hash" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\wintun" -Force
          New-Item -ItemType Directory -Force src-tauri\resources | Out-Null
          Copy-Item "$env:RUNNER_TEMP\wintun\wintun\bin\amd64\wintun.dll" src-tauri\resources\wintun.dll

      # No Developer ID yet: ad-hoc sign so Apple Silicon accepts the bundle
      # (users still need "Open Anyway" / `xattr -cr` on first launch).
      - name: Ad-hoc signing identity (macOS)
        if: runner.os == 'macOS'
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm --dir ui tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          bundle="target/${{ matrix.target }}/release/bundle"
          shopt -s nullglob
          for f in "$bundle"/dmg/*.dmg "$bundle"/nsis/*.exe; do
            cp "$f" out/
          done
          ls -la out
          [ -n "$(ls -A out)" ] || { echo "no installers produced" >&2; exit 1; }

      - uses: actions/upload-artifact@v5
        with:
          name: prism-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # gh is preinstalled on the runner; on failure its message is surfaced
      # as an annotation so it's readable without downloading logs.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          ## Скачать · Download

          | Платформа · Platform | Файл · File |
          |---|---|
          | macOS · Apple Silicon (M1–M4) | `Prism_*_aarch64.dmg` |
          | macOS · Intel | `Prism_*_x64.dmg` |
          | Windows · x64 | `Prism_*_x64-setup.exe` |

          > **Приложение пока не подписано сертификатом разработчика.**
          > **macOS:** если система пишет, что приложение повреждено или его нельзя открыть, выполните `xattr -cr /Applications/Prism.app` или разрешите запуск в «Системные настройки → Конфиденциальность и безопасность → Всё равно открыть».
          > **Windows:** в окне SmartScreen нажмите «Подробнее» → «Выполнить в любом случае».
          >
          > **Not code-signed yet.**
          > **macOS:** if it says the app is damaged or can't be opened, run `xattr -cr /Applications/Prism.app`, or allow it in System Settings → Privacy & Security → *Open Anyway*.
          > **Windows:** in the SmartScreen prompt, click *More info* → *Run anyway*.
          NOTES
          # GitHub occasionally answers 5xx here: retry, and never leave a
          # half-made release behind between attempts.
          for attempt in 1 2 3 4; do
            if out=$(gh release create "$GITHUB_REF_NAME" dist/* --title "Prism $GITHUB_REF_NAME" --notes-file notes.md 2>&1); then
              echo "$out"
              exit 0
            fi
            echo "attempt $attempt: $out"
            gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
            sleep $((attempt * 15))
          done
          echo "::error title=gh release create failed::$(echo "$out" | tr '\n' ' ')"
          exit 1
